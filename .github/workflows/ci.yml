name: CI

# This project is tested on the Owner's Windows 11 PC through a self-hosted GitHub
# Actions runner. There are no GitHub-hosted jobs, and because the repository is
# PUBLIC the runner must never execute code from untrusted pull requests: only
# pushes to the default branch and manual dispatches are allowed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Install, compile and smoke test (Windows, self-hosted)
    runs-on: [self-hosted, Windows, X64, conference-management-system]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip check

      - name: Byte-compile sources
        run: .\.venv\Scripts\python.exe -m compileall -q app.py ci_smoke.py init_db.py dummy_data.py conn_test.py new_staff.py

      - name: Smoke test (routes and templates)
        run: .\.venv\Scripts\python.exe ci_smoke.py
